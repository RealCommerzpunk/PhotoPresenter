<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: photo:; connect-src 'self' ws: photo:"
    />
    <title>PhotoPresenter – Show</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        cursor: none;
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #texts {
        position: fixed;
        inset: 0;
        container-type: size;
        pointer-events: none;
        overflow: hidden;
      }
      .overlay {
        position: fixed;
        color: #fff;
        opacity: 0;
        transition: opacity 0.4s ease;
        pointer-events: none;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      }
      #message {
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        white-space: pre-line;
        font-size: 28px;
        font-weight: 300;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.8);
      }
      #emojis {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .emoji {
        position: absolute;
        line-height: 1;
        font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
        filter: drop-shadow(0 0.6vmin 1.2vmin rgba(0, 0, 0, 0.45));
        will-change: transform, opacity;
      }
      #info {
        left: 24px;
        bottom: 20px;
        max-width: min(560px, 80vw);
        font-size: 14px;
        line-height: 1.45;
        padding: 14px 18px;
        border-radius: 14px;
        /* kein backdrop-filter: der liest jeden Frame das WebGL-Bild zurück */
        background: rgba(8, 10, 16, 0.86);
        z-index: 4;
      }
      #info .info-title {
        font-size: 17px;
        font-weight: 600;
        margin-bottom: 8px;
        word-break: break-all;
      }
      #info table {
        border-collapse: collapse;
      }
      #info th {
        text-align: left;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.6);
        padding: 1px 14px 1px 0;
        white-space: nowrap;
        vertical-align: top;
      }
      #info td {
        padding: 1px 0;
        font-variant-numeric: tabular-nums;
      }
      #info .info-hint {
        margin-top: 8px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.4);
      }
      #qr {
        right: 32px;
        bottom: 32px;
        width: 260px;
        padding: 18px;
        border-radius: 18px;
        background: rgba(10, 12, 18, 0.82);
        backdrop-filter: blur(10px);
        text-align: center;
        z-index: 5;
      }
      #qr .qr-code svg {
        width: 100%;
        height: auto;
        background: #fff;
        border-radius: 10px;
        display: block;
      }
      #qr .qr-title {
        margin-top: 12px;
        font-size: 18px;
        font-weight: 600;
      }
      #qr .qr-text {
        margin-top: 4px;
        font-size: 15px;
        color: rgba(255, 255, 255, 0.75);
        word-break: break-all;
      }
      #lyrics {
        position: fixed;
        left: 0;
        right: 0;
        text-align: center;
        padding: 3vh 6vw;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.6s ease;
        z-index: 3;
        font-weight: 700;
        color: #fff;
        filter: drop-shadow(0 0.3vh 0.8vh rgba(0, 0, 0, 0.9));
      }
      #lyrics[data-pos='bottom'] {
        bottom: 0;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0));
        padding-top: 9vh;
      }
      #lyrics[data-pos='top'] {
        top: 0;
        background: linear-gradient(to bottom, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0));
        padding-bottom: 9vh;
      }
      #lyrics[data-pos='center'] {
        top: 50%;
        transform: translateY(-50%);
        background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0) 70%);
      }
      #lyrics {
        --s: 1; /* Schriftgröße (Einstellung) */
      }
      /* Alle Zeilen stehen in einer Spalte, die per Skript gleitet; die laufende Zeile wird
         per scale() vergrößert (kein Neuumbruch, kein Ruckeln). */
      #lyrics .ly-view {
        position: relative;
      }
      #lyrics .ly-track {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        will-change: transform;
      }
      #lyrics .ly-row {
        --p: 0%;
        box-sizing: border-box;
        width: fit-content; /* damit die Füllung genau über den Text läuft */
        max-width: 62%;
        margin: 0 auto;
        padding: 0.45em 0;
        font-size: calc(3.6vh * var(--s));
        line-height: 1.3;
        color: transparent;
        background: linear-gradient(90deg, #ffd54a var(--p), #ffffff var(--p));
        -webkit-background-clip: text;
        background-clip: text;
        will-change: transform, opacity;
      }
      #lyrics .ly-title,
      #lyrics .ly-rest {
        background: none;
        color: #fff;
        letter-spacing: 0.08em;
      }
      /* Hintergrund während des Liedes: Foto bildfüllend, abgedunkelt */
      #songBg {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.2s ease;
      }
      #songBg .bg-fill {
        position: absolute;
        inset: -6%;
        background-size: cover;
        background-position: center;
        filter: blur(36px) saturate(1.1);
      }
      #songBg img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #songBg .bg-dim {
        position: absolute;
        inset: 0;
        background: #000;
      }
      #songPick {
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        z-index: 6;
      }
      #songPick .pick-box {
        min-width: 40vw;
        max-width: 80vw;
        padding: 3vh 4vw;
        border-radius: 18px;
        background: rgba(12, 14, 20, 0.92);
        color: #fff;
      }
      #songPick .pick-title {
        font-size: 4vh;
        font-weight: 600;
        margin-bottom: 2vh;
      }
      #songPick .pick-item {
        font-size: 3.4vh;
        padding: 0.8vh 1vw;
        border-radius: 10px;
        color: rgba(255, 255, 255, 0.8);
      }
      #songPick .pick-item.on {
        background: rgba(255, 213, 74, 0.2);
        color: #fff;
      }
      #songPick .pick-hint {
        margin-top: 2vh;
        font-size: 2.2vh;
        color: rgba(255, 255, 255, 0.5);
      }
      #status {
        right: 24px;
        top: 20px;
        font-size: 18px;
        background: rgba(0, 0, 0, 0.45);
        padding: 6px 14px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="songBg">
      <div class="bg-fill"></div>
      <img alt="" />
      <div class="bg-dim"></div>
    </div>
    <div id="texts"></div>
    <div id="emojis"></div>
    <div id="message" class="overlay" style="opacity: 1">Lade Fotos …</div>
    <div id="info" class="overlay"></div>
    <div id="lyrics" data-pos="bottom"></div>
    <div id="songPick" class="overlay"></div>
    <div id="status" class="overlay"></div>
    <div id="qr" class="overlay">
      <div class="qr-code"></div>
      <div class="qr-title">Fernbedienung</div>
      <div class="qr-text"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
