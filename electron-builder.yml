appId: de.realcommerzpunk.photopresenter
productName: PhotoPresenter
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources
    to: resources
    filter: ['**/*']
  - from: Quickstart.pdf
    to: resources/Quickstart.pdf
win:
  target: [nsis, portable]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage, deb]
  category: Graphics
  maintainer: RealCommerzpunk
publish: null
